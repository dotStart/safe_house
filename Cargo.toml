[package]
name = "safe_house"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/dotstart/safe_house"
license = "AGPL-3"

[features]
ui = ["dep:rust-embed"]

[dependencies]
base32 = "0.5.1"
bcrypt = "0.19.0"
byteorder = "1.5.0"
dashmap = "6.1.0"
governor = "0.10.4"
nonzero_ext = "0.3.0"
rmp-serde = "1.3.1"
zxcvbn = "3.1.0"

[dependencies.chrono]
version = "0.4.44"
features = ["serde"]

[dependencies.config]
version = "0.15.22"
features = ["toml", "convert-case"]
default-features = false

[dependencies.jsonwebtoken]
version = "10.3.0"
features = ["rust_crypto"]
default-features = false

[dependencies.rand]
version = "0.10.0"
features = ["thread_rng"]

[dependencies.rocket]
version = "0.5.1"
features = ["json"]

[dependencies.rocksdb]
version = "0.24.0"
features = ["multi-threaded-cf"]

[dependencies.rust-embed]
version = "8.11.0"
features = ["compression", "deterministic-timestamps", "rocket"]
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.serde_with]
version = "3.18.0"
features = ["base64"]