name: Build Release

on:
  push:
    branches:
      - 'main'
      - 'dev'
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm dependencies
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-modules

      - name: Install Dependencies
        working-directory: ./web
        run: |
          npm install
      - name: Build
        working-directory: ./web
        run: |
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: ui
          path: web/dist/

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
      - name: Retrieve UI build
        uses: actions/download-artifact@v5
        with:
          name: ui
          path: web/dist/

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --target ${{ matrix.toolchain }} --features ui --package safe_house --bin safe_house --profile release --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.toolchain }}
          path: target/${{ matrix.toolchain }}/release/safe_house

  container:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Retrieve UI build
        uses: actions/download-artifact@v5
        with:
          name: server-x86_64-unknown-linux-musl
          path: docker/

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}